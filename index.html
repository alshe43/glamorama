<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Glamorama: досье на игроков</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet"><style id="app-css">:root{
  --me:#2A6FD6; --tgt:#D8622A;
  --bg:#F6ECEE; --surface:#FFF9F9; --surface2:#F0DFE5; --ink:#2B1428; --muted:#7A6275; --line:#E3CDD5;
  --gold:#9A6E24; --gold-soft:#EDD9AE; --under:#B4235F; --lilac:#7246C2; --mint:#2C8A66; --grey:#9A8C96;
  --on-gold:#1B0D19; --scrim:rgba(43,20,40,.45); --shadow:0 20px 60px rgba(60,20,50,.22);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B0D19; --surface:#261424; --surface2:#341C31; --ink:#F6E8EE; --muted:#B39AAD; --line:#46293F;
    --me:#7DB0FF; --tgt:#FF9A5E;
    --gold:#E4C285; --gold-soft:#5A4423; --under:#F25A92; --lilac:#B794FF; --mint:#72CBA6; --grey:#8F7F8B;
    --scrim:rgba(8,2,8,.62); --shadow:0 20px 60px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B0D19; --surface:#261424; --surface2:#341C31; --ink:#F6E8EE; --muted:#B39AAD; --line:#46293F;
  --gold:#E4C285; --gold-soft:#5A4423; --under:#F25A92; --lilac:#B794FF; --mint:#72CBA6; --grey:#8F7F8B;
  --scrim:rgba(8,2,8,.62); --shadow:0 20px 60px rgba(0,0,0,.55); color-scheme:dark; --me:#7DB0FF; --tgt:#FF9A5E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Manrope","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:20px;padding-right:20px}
.disp{font-family:"Prata","Playfair Display",Georgia,"Times New Roman",serif;font-weight:400}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:6px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wm{font-family:"Prata",Georgia,serif;font-size:28px;color:var(--gold);letter-spacing:.01em}
.sub{color:var(--muted);font-size:14px}
.ro{color:var(--muted);font-size:13px;white-space:nowrap}

/* hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px 44px;align-items:center;padding-top:22px;padding-bottom:30px}
.cyc{display:flex;flex-direction:column}
.cyc-l{color:var(--muted);font-size:14px;margin-bottom:4px}
.cyc-n{font-family:"Prata",Georgia,serif;font-size:clamp(84px,13vw,156px);line-height:1;color:var(--gold);margin-top:2px}
.cyc-in{font-family:"Prata",Georgia,serif;font-size:72px;line-height:1;width:2.6ch;background:var(--surface);color:var(--gold);border:1px solid var(--line);border-radius:12px;padding:4px 8px}
.days{list-style:none;margin:0;padding:0;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.days li>*{display:block;padding:7px 16px;font-size:14px;border:0;background:none;color:var(--muted)}
.days li+li>*{border-left:1px solid var(--line)}
.days li.cur>*{background:var(--ink);color:var(--bg);font-weight:600}
.days button{cursor:pointer}
.party{margin-top:16px;max-width:60ch}
.lbl{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.party-t{font-family:"Prata",Georgia,serif;font-size:24px;line-height:1.25}
.party-t.none{color:var(--muted);font-size:20px}
.cgroups{display:flex;flex-direction:column;gap:14px}
.cg-t{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.counts{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0}
.next{color:var(--muted);font-size:14px;margin:10px 0 0}
.counts dt{color:var(--muted);font-size:13px}
.counts dd{margin:0;font-family:"Prata",Georgia,serif;font-size:34px;line-height:1.1}
.counts .c-in dd{color:var(--mint)} .counts .c-ex dd{color:var(--lilac)} .counts .c-club dd{color:var(--gold)} .counts .c-under dd{color:var(--under)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:14px 0 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
main{padding-top:24px;padding-bottom:110px}

/* panels */
.ov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.span2{grid-column:1/-1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 16px;min-width:0}
.panel h2,.sec h3,.modal h2{font-family:"Prata",Georgia,serif;font-weight:400;font-size:21px;margin:0 0 14px;line-height:1.2}
.ph-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph-row h2{margin-bottom:6px}
.empty{color:var(--muted);margin:6px 0 10px;max-width:56ch}
.more{background:none;border:0;color:var(--gold);font-weight:600;padding:8px 0 2px;cursor:pointer}

/* ranks */
.rank{list-style:none;margin:0;padding:0}
.rk-b{width:100%;display:grid;grid-template-columns:24px 28px minmax(0,1fr) 28% 56px;gap:10px;align-items:center;padding:6px 6px;background:none;border:0;border-radius:10px;text-align:left;cursor:pointer}
.rk-b:hover{background:var(--surface2)}
.rk-n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.rk-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.rk-v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.is-out{opacity:.5}

/* last cycle */
.lc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;margin:0}
.lc dt{color:var(--muted);font-size:13px;margin-bottom:4px}
.lc dd{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.lc-sub{color:var(--muted);margin:0 0 16px}

/* sides */
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);margin:6px 0 10px}
.sbar i{display:block;height:100%}
.sbar .club,.dot.club{background:var(--gold)} .sbar .under,.dot.under{background:var(--under)} .sbar .unknown,.dot.unknown{background:var(--grey);opacity:.45}
.sleg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin-bottom:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sh{font-size:13px;color:var(--muted)}

/* avatars */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;display:inline-block}
.av-ph{display:inline-grid;place-items:center;background:var(--surface2);color:var(--muted);font-weight:700;font-size:13px}
.av-s{width:28px;height:28px;font-size:11px}
.av-xl{width:104px;height:104px;font-size:30px;font-family:"Prata",Georgia,serif;font-weight:400}

/* chips & tags */
.pchip{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:0;border-radius:999px;padding:3px 10px 3px 3px;font-size:14px;cursor:pointer;max-width:100%}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .av{width:24px;height:24px;font-size:10px}
.pchip small{color:var(--muted);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;line-height:1.6}
.tag.s-in::before,.tag.s-exstas::before,.tag.s-out::before{content:"";width:7px;height:7px;border-radius:50%}
.tag.s-in::before{background:var(--mint)} .tag.s-exstas::before{background:var(--lilac)} .tag.s-out::before{background:var(--grey)}
.tag.sd-club{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.tag.sd-under{color:var(--under);border-color:color-mix(in srgb,var(--under) 45%,transparent)}
.tag.sd-unknown{color:var(--muted)}
.tag em{font-style:normal;font-weight:500;opacity:.8}
.cat{border:0}
.cat.k-glam{background:var(--gold);color:var(--on-gold)}
.cat.k-gold{background:var(--gold-soft);color:var(--ink)}
.cat.k-main{background:var(--surface2);color:var(--ink)}
.cat.k-anti{background:color-mix(in srgb,var(--under) 22%,transparent);color:var(--under)}
.cat.k-flop{background:var(--under);color:#fff}
.cat.k-none{background:transparent;color:var(--muted);border:1px dashed var(--line)}

/* players */
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:18px}
.search{flex:1 1 220px;max-width:340px}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column;cursor:pointer}
.card:hover{border-color:var(--gold)}
.card .pic{aspect-ratio:1/1;width:100%;object-fit:cover;display:block;background:var(--surface2)}
.card .pic-ph{display:grid;place-items:center;font-family:"Prata",Georgia,serif;font-size:52px;color:var(--gold)}
.card.st-out .pic,.card.st-exstas .pic{filter:grayscale(1);opacity:.55}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.card .nm{font-weight:700;font-size:16px;line-height:1.25}
.card .rl{color:var(--muted);font-size:13px;margin-top:-4px}
.card .tg{display:flex;flex-wrap:wrap;gap:5px}
.card .nums{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:auto}
.card .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.strip .k-glam{background:var(--gold)} .strip .k-gold{background:var(--gold-soft)} .strip .k-main{background:var(--grey);opacity:.5}
.strip .k-anti{background:color-mix(in srgb,var(--under) 45%,transparent)} .strip .k-flop{background:var(--under)} .strip .k-none{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}

/* graph */
.gtools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px}
.lg{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.lg[aria-pressed="false"]{opacity:.45}
.lg svg{flex:none}
.graph-wrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;overflow-x:auto}
.graph{display:block;width:100%;min-width:560px;max-width:880px;height:auto;margin:0 auto}
.e{fill:none;stroke-width:1.7;opacity:.85;transition:opacity .15s}
.e-ally{stroke:var(--gold)} .e-rival{stroke:var(--under);stroke-dasharray:6 5} .e-target{stroke:var(--lilac)}
.e-target.c-confirmed{stroke-width:2.8} .e-target.c-guess{stroke-dasharray:2 4;opacity:.7}
.n{cursor:pointer;transition:opacity .15s}
.n .ring{fill:var(--surface2);stroke-width:3}
.n.sd-club .ring{stroke:var(--gold)} .n.sd-under .ring{stroke:var(--under)} .n.sd-unknown .ring{stroke:var(--grey)}
.n .ini{fill:var(--muted);font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:"Manrope",sans-serif}
.n .lb{fill:var(--ink);font-size:13px;font-family:"Manrope",sans-serif}
.n.st-out{opacity:.4} .n.st-out image{filter:grayscale(1)}
.n:focus{outline:none} .n:focus-visible .ring{stroke:var(--ink);stroke-width:4}
svg.has-hl .e{opacity:.07} svg.has-hl .e.on{opacity:1}
svg.has-hl .n{opacity:.25} svg.has-hl .n.on{opacity:1}
.ltable{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lrow .ar{color:var(--muted)}
.lrow .nt{color:var(--muted);font-size:14px;flex:1 1 200px}
.lrow .acts{margin-left:auto;display:flex;gap:6px}

/* cycles */
.cylist{display:flex;flex-direction:column;gap:16px}
.cy .lc{margin-top:4px}
.cy-note{color:var(--muted);margin:14px 0 0;max-width:70ch;white-space:pre-wrap}

/* buttons & forms */
.btn{font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn-gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn-on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-danger{color:var(--under)}
.btn-danger.armed{background:var(--under);color:#fff;border-color:var(--under)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.6;cursor:default}
.inp{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea.inp{min-height:96px;resize:vertical}
.inp:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld>span{color:var(--muted);font-size:13px}
.r2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;padding:8px 14px;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}

/* layer: drawer & modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--bg);z-index:41;overflow-y:auto;border-left:1px solid var(--line);box-shadow:var(--shadow);
  padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 100px)}
.drawer.anim{animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dr-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.dr-name{font-family:"Prata",Georgia,serif;font-size:30px;line-height:1.15;margin:0 0 8px;overflow-wrap:anywhere}
.dr-tags{display:flex;flex-wrap:wrap;gap:6px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;align-self:start}
.sec{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.sec h3{font-size:19px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:9px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.kv dd .cf{color:var(--muted);font-size:13px;margin-left:6px}
.unk{color:var(--muted)}
.st3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.st3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.st .v{font-family:"Prata",Georgia,serif;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.st .l{color:var(--muted);font-size:12px}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.clist li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.clist li:last-child{border-bottom:0}
.clist .cn{font-weight:700;min-width:72px}
.clist .cc{color:var(--muted);flex:1 1 120px;font-size:14px}
.clist select{max-width:220px;margin-left:auto}
.lgroup{margin-bottom:12px}
.lgroup .lbl{margin-bottom:6px}
.lgroup .lst{display:flex;flex-wrap:wrap;gap:6px}
.notes{white-space:pre-wrap;margin:0;max-width:62ch}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.danger-zone{margin-top:30px}

.scrim.m{z-index:50}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:51;width:min(660px,calc(100% - 24px));
  max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.mh h2{margin:0}
.mf{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.res{list-style:none;margin:0;padding:0}
.res li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.res li span:not(.av){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res select{width:auto;max-width:56%}
.err{color:var(--under);font-size:14px;margin:0 0 10px}

/* save bar, toast, banner */
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:70;display:flex;align-items:center;gap:14px;
  background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 7px 7px 20px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100% - 24px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:80;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);font-size:14px;max-width:min(460px,calc(100% - 24px));opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--gold-soft);border-radius:12px;padding:12px 16px;margin-top:10px}
.banner p{margin:0;flex:1 1 260px}

@media (max-width:820px){
  .hero{grid-template-columns:auto minmax(0,1fr);gap:20px 28px}
  .cgroups{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:14px 40px}
}
@media (max-width:640px){
  .wrap{padding-left:16px;padding-right:16px}
  .hero{grid-template-columns:1fr}
  .ov{grid-template-columns:1fr}
  .rk-b{grid-template-columns:22px 28px minmax(0,1fr) 50px}
  .rk-bar{display:none}
  .drawer{padding-left:18px;padding-right:18px}
  .dr-h{grid-template-columns:auto minmax(0,1fr) auto;gap:12px}
  .av-xl{width:76px;height:76px;font-size:24px}
  .dr-name{font-size:24px}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .r2,.r3{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;margin-bottom:18px}
.pwc{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;cursor:pointer;min-width:0}
.pwc:hover{background:var(--surface2)}
.pwc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pwc input{accent-color:var(--gold);width:16px;height:16px;flex:none}

.lc .full{grid-column:1/-1}

.prog{display:flex;flex-direction:column;gap:8px;margin:8px 0 18px}
.prow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.pcells{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.pcells i{height:14px;border-radius:3px}
.pcells .club{background:var(--gold)} .pcells .under{background:var(--under)} .pcells .gone{background:var(--grey);opacity:.35}
.pv{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap} .pv b{color:var(--ink)}

.kbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.kbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;text-align:left;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
.kbtn:hover{border-color:var(--gold)}
.kbtn[aria-expanded="true"]{border-color:var(--gold);background:var(--bg)}
.kbtn .kl{color:var(--muted);font-size:13px;grid-column:1}
.kbtn .kvv{grid-column:1;font-size:15px;color:var(--muted)} .kbtn .kvv b{font-family:"Prata",Georgia,serif;font-weight:400;font-size:26px;color:var(--ink);margin-right:2px}
.kbtn .kc{grid-column:2;grid-row:1/3;align-self:center;font-size:20px;color:var(--gold);width:20px;text-align:center}
.klist{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.kg .lbl{margin-bottom:6px}
.kchips{display:flex;flex-wrap:wrap;gap:6px}

.sched-h{margin-bottom:18px}
.sched-h p{margin:0 0 6px;max-width:70ch} .sched-h b{font-variant-numeric:tabular-nums}
.cleg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:14px}
.cleg span{display:inline-flex;align-items:center;gap:7px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}
.cals{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
.cd{aspect-ratio:1/1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;line-height:1.1;position:relative}
.cd b{font-weight:600} .cd small{font-size:10px;font-weight:600;opacity:.85}
.cd.none{color:var(--muted)} .cd.blank{visibility:hidden}
.ph0,.sw.ph0{background:var(--gold);color:var(--on-gold)}
.ph1,.sw.ph1{background:var(--under);color:#fff}
.ph2,.sw.ph2{background:color-mix(in srgb,var(--lilac) 28%,transparent);color:var(--ink)}
.cd.past{opacity:.38}
.cd.today,.sw.today{outline:2px solid var(--ink);outline-offset:1px}
.sw.today{background:transparent}
.cd.top3,.sw.top3{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--mint)}
.sw.top3{background:var(--under)}

.cal summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
.cal summary::-webkit-details-marker{display:none}
.cal summary h2{margin:0}
.cal[open] summary{margin-bottom:14px}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px}
.cal[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
.cals{align-items:start}

/* hero stat cards */
.cgroups{display:flex;flex-direction:row;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px 14px;min-width:0}
.sc .cg-t{margin-bottom:8px}
.st-row{display:flex;gap:22px}
.st-i{display:flex;flex-direction:column;gap:2px}
.st-l{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.st-l i{width:7px;height:7px;border-radius:50%;background:var(--grey)}
.st-v{font-family:"Manrope",system-ui,sans-serif;font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums;color:var(--ink)}
.st-v small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:2px}
.k-in .st-l i,.st-bar .k-in{background:var(--mint)}
.k-ex .st-l i,.st-bar .k-ex{background:var(--lilac)}
.k-out .st-l i,.st-bar .k-out{background:var(--grey)}
.k-club .st-l i,.st-bar .k-club{background:var(--gold)}
.k-under .st-l i,.st-bar .k-under{background:var(--under)}
.st-bar .k-gone{background:var(--grey);opacity:.3}
.st-bar .gap{background:transparent}
.st-bar{display:flex;gap:2px;height:6px;margin-top:10px;border-radius:3px;overflow:hidden}
.st-bar i{display:block;height:100%}
@media (max-width:820px){.cgroups{justify-content:flex-start}}
@media (max-width:640px){.cgroups{flex-direction:column}.sc{width:100%}}

.fsel{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.fsel select{width:auto;min-width:150px;padding-right:32px}

.card .lft{font-size:12px;color:var(--muted)}
.svc{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
.svc input{accent-color:var(--gold);width:15px;height:15px}

.modal.pwdm{width:min(400px,calc(100% - 24px))}

.tag.doubt{border-style:dashed}
.tag.tgt{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.plc{background:var(--surface2);color:var(--ink)}
.tag.ab.used{background:var(--surface2);color:var(--muted)}
.tag.ab.free{color:var(--mint);border-color:color-mix(in srgb,var(--mint) 45%,transparent)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--gold);width:16px;height:16px}
.ab-in{min-height:70px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.rtbl{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.rtbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 14px;border-bottom:1px solid var(--line)}
.rtbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.rtbl tr:last-child td{border-bottom:0}
.rtbl .rn{color:var(--muted);width:36px;font-variant-numeric:tabular-nums}
.rtbl .rname{font-weight:700;white-space:nowrap}
.rtbl .abt{max-width:52ch;margin-bottom:6px}
.rtbl .unk-row td{padding-top:8px;padding-bottom:8px}
.rtbl td .inp{min-width:140px}

.sides-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 40px;align-items:start}
.sides-p .klist{flex-direction:row;flex-wrap:wrap;gap:12px 40px}
@media (max-width:760px){.sides-g{grid-template-columns:1fr}}

.thb{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.thb:hover,.thb.on{color:var(--ink)}
.thb .sa{font-size:10px;opacity:.6}
.thb.on .sa{opacity:1;color:var(--gold)}

/* personal highlights */
.pchip.hl-me{background:color-mix(in srgb,var(--me) 22%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--me)}
.pchip.hl-tgt{background:color-mix(in srgb,var(--tgt) 22%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--tgt)}
.rk-b.hl-me{background:color-mix(in srgb,var(--me) 14%,transparent);box-shadow:inset 3px 0 0 var(--me)}
.rk-b.hl-tgt{background:color-mix(in srgb,var(--tgt) 14%,transparent);box-shadow:inset 3px 0 0 var(--tgt)}
.card.hl-me{border:2px solid var(--me)}
.card.hl-tgt{border:2px solid var(--tgt)}
.rtbl tr.hl-me td{background:color-mix(in srgb,var(--me) 10%,transparent)}
.rtbl tr.hl-me td:first-child{box-shadow:inset 3px 0 0 var(--me)}
.rtbl tr.hl-tgt td{background:color-mix(in srgb,var(--tgt) 10%,transparent)}
.rtbl tr.hl-tgt td:first-child{box-shadow:inset 3px 0 0 var(--tgt)}
.tag.tgt{background:var(--tgt);border-color:var(--tgt);color:#fff}

span.is-out{display:inline-flex}
.panel .ph-row .chip{margin-bottom:6px}
.is-out .av{filter:grayscale(1)}

function loadState(){
  let s = {};
  try { s = JSON.parse(document.getElementById('glam-state').textContent) || {}; } catch (e) {}
  return normState(s);
}
function normState(s){
  s.meta = Object.assign({cycle:1, day:'contest', updated:0}, s.meta || {});

}

const $ = s => document.querySelector(s);

function pname(p){ return p ? (String(p.name || '').trim() || 'Без имени') : '—'; }

}
function sideTotals(){
  const c = (S.meta.conv && S.meta.conv.toClub) || 0, u = (S.meta.conv && S.meta.conv.toUnder) || 0;
  const tot = {club:12 + c - u, under:12 - c + u}, left = {club:0, under:0};

}
function hlc(p){ return p && p.me ? ' hl-me' : p && p.target ? ' hl-tgt' : ''; }

function anchorDay(a){ const [y, m, d] = a.date.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; }
function clock(){
  const list = [...S.meta.anchors].sort((x, y) => anchorDay(x) - anchorDay(y));
  const today = Math.floor((Date.now() + 3 * 3600e3) / 864e5);
  let ai = 0; list.forEach((a, i) => { if (anchorDay(a) <= today) ai = i; });
  const a = list[ai], next = list[ai + 1], k = today - anchorDay(a);
  let cycle = a.cycle + Math.floor(k / 3), day = DAYS[((k % 3) + 3) % 3][0];
  if (next && cycle >= next.cycle) { cycle = next.cycle - 1; day = 'off'; }
  return {cycle, day, anchor: a};
}
function syncClock(){
  const c = clock(), changed = c.cycle !== S.meta.cycle || c.day !== S.meta.day;
  S.meta.cycle = c.cycle; S.meta.day = c.day; return changed;
}
setInterval(() => { if (syncClock()) renderApp(); }, 30000);

}

  if (f === 'player') { if (v) S.roles.forEach(x => { if (x.player === v && x.id !== rid) x.player = ''; }); }
  r[f] = v; touch(); if (re) { renderApp(); renderLayer(); }
}
function rolesHTML(){
  const rank = r => (r.name ? 0 : 2) + (r.player ? 0 : 1);
  const base = [...S.roles].sort((a, b) => rank(a) - rank(b) || (a.name || '').localeCompare(b.name || '', 'ru'));
  const order = new Map(base.map((r, i) => [r.id, i]));
  const SO = {club:0, under:1, unknown:2};
  const keyOf = {
    n: r => order.get(r.id),
    name: r => r.name ? r.name.toLowerCase() : null,
    side: r => SO[roleSide(r)] === 2 ? null : SO[roleSide(r)],
    ability: r => r.ability ? (r.used ? 1 : 0) : null,
    player: r => r.player && P(r.player) ? pname(P(r.player)).toLowerCase() : null
  };
  let list = base.filter(r => rolesF.side === 'all' || roleSide(r) === rolesF.side);
  const kf = keyOf[rolesF.sort] || keyOf.n, dir = rolesF.dir;
  list.sort((a, b) => { const x = kf(a), y = kf(b);
    if (x === null && y === null) return order.get(a.id) - order.get(b.id);
    if (x === null) return 1; if (y === null) return -1;
    const c = typeof x === 'string' ? x.localeCompare(y, 'ru') : x - y;
    return c * dir || order.get(a.id) - order.get(b.id); });
  const known = S.roles.filter(r => r.name).length;
  const sideCell = r => { const s = roleSide(r), p = r.player && P(r.player);

  if (delArm !== id) { delArm = id; renderLayer(); return; }
  const dc = S.cycles.find(c => c.id === id); if (dc && autoOn(dc)) applyRewards(dc, -1);
  S.cycles = S.cycles.filter(c => c.id !== id); modal = null; delArm = null; touch(); render(); toast('Цикл удалён');
}
function pickPhoto(id, input){
  const f = input.files && input.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), cv = document.createElement('canvas');
      cv.width = cv.height = 360;
      cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) * 0.3, s, s, 0, 0, 360, 360);
      setP(id, 'photo', cv.toDataURL('image/jpeg', 0.82), 'both');
    };
    img.onerror = () => toast('Не получилось прочитать изображение. Попробуйте JPG или PNG.');
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
}

/* save */
function renderSaveBar(){
  const el = $('#savebar'); if (!el) return;
  if (!owner || (!dirty && !saving)) { el.className = ''; el.innerHTML = ''; return; }
  el.className = 'savebar';
  el.innerHTML = '<span>' + (saving ? 'Сохраняю…' : 'Есть несохранённые изменения') + '</span><button class="btn btn-gold" ' + (saving ? 'disabled' : '') + ' onclick="save()">Сохранить</button>';
}
function buildDoc(){
  const css = document.getElementById('app-css').textContent;
  const js = document.getElementById('app-js').textContent;
  const json = JSON.stringify(S).replace(/</g, '\\u003c');
  const SC = '<' + '/script>';
  return '<!doctype html>\n<html lang="ru"><head>' + HEAD + '<style id="app-css">' + css + '</style></head><body>' + BODY +
    '<script type="application/json" id="glam-state">' + json + SC + '<script id="app-js">' + js + SC + '</body></html>';
}
async function save(retry){
  if (!artNS || (saving && !retry)) return;
  saving = true; renderSaveBar();
  S.meta.updated = Date.now();
  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(S)); } catch (e) {}
  try {
    await artNS.publish(buildDoc());
    dirty = false; saving = false; renderSaveBar(); toast('Сохранено');
  } catch (e) {
    const code = e && e.code;
    if (code === 'upstream_error' && !retry) { setTimeout(() => save(true), 800 + Math.random() * 1200); return; }
    saving = false;
    if (code === 'conflict') toast('Страница обновилась в другом окне. Черновик сохранён, его можно восстановить.');
    else if (['not_writer','not_granted','capability_disabled','consent_required','capability_removed','not_declared'].includes(code)) { owner = false; editing = false; toast('Здесь страница открыта только для просмотра.'); render(); return; }
    else if (code === 'too_large') toast('Слишком большой объём. Замените или уберите несколько фото.');
    else if (code === 'rate_limited') toast('Слишком частые сохранения. Подождите минуту и сохраните снова.');
    else toast('Не удалось сохранить. Изменения остались на странице, попробуйте ещё раз.');
    renderSaveBar();
  }
}
let toastT;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3600); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (modal) closeM(); else if (drawer) closeP(); } });
window.addEventListener('beforeunload', e => { if (dirty && !saving) { e.preventDefault(); e.returnValue = ''; } });
render();
</script></body></html>
